query GetExtensions($condition: ExtensionConditionInput, $first: Int, $offset: Int) {
  extensions(condition: $condition, first: $first, offset: $offset) {
    nodes {
      ...ExtensionFields
    }
    pageInfo {
      ...PageInfoFields
    }
    totalCount
  }
}

query GetExtension($pkgName: String!) {
  extension(pkgName: $pkgName) {
    ...ExtensionFields
  }
}
