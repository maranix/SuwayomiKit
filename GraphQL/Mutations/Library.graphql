mutation UpdateLibrary($input: UpdateLibraryInput!) {
  updateLibrary(input: $input) {
    updateStatus {
      jobsInfo {
        isRunning
        totalJobs
        finishedJobs
        skippedCategoriesCount
        skippedMangasCount
      }
    }
  }
}

mutation UpdateStop($input: UpdateStopInput!) {
  updateStop(input: $input) {
    clientMutationId
  }
}
